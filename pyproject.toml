[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-foundry"
version = "0.2.0.dev0"
description = "Provider-neutral tooling for turning new or existing projects into bounded AI-native execution environments"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-foundry = "agent_foundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root is on the path so the end-to-end suite can import its own
# harness as `tests.e2e.pipeline`. Without it, bare `pytest` collects those modules
# as top-level `e2e.*` and the intra-suite imports fail — which is exactly how CI
# would run them.
pythonpath = ["src", "."]
